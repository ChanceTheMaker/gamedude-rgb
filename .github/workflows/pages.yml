name: Publish GameDude Color
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:usb-helper
      - name: Stage verified public assets
        run: python tools/make_site.py
      - run: node tests/smk_diagnostics.mjs && python3 tests/smk_diagnostics.py
      - run: cc -O1 -UNDEBUG -DTEST_PUBLIC -Ivendor/smk-updater vendor/smk-updater/update_test.c -o /tmp/smk-compat && /tmp/smk-compat
      - run: cc -O1 -UNDEBUG -Ivendor/smk-updater tests/smk37_flash_profile_test.c -o /tmp/smk-profile && /tmp/smk-profile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
